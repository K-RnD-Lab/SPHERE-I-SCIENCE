<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="Human demographic evidence from deep time to modern statistics">
<rect width="100%" height="100%" fill="#fafafa"/>
<text x="90" y="30" font-size="23" font-weight="700" fill="#111827">Human demographic evidence across deep time</text>
<text x="90" y="52" font-size="13" fill="#52525b">Evidence types change across eras; positions are schematic and not proportional to elapsed time.</text>
<line x1="90" x2="900" y1="90" y2="90" stroke="#71717a" stroke-width="2"/>
<line x1="90" x2="90" y1="90" y2="108" stroke="#a1a1aa" stroke-width="1"/>
<circle cx="90" cy="90" r="8" fill="#9333ea"/>
<text x="90" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">315,000 BCE</text>
<text x="90" y="152" text-anchor="middle" font-size="12" fill="#374151">Early H. sapiens</text>
<text x="90" y="170" text-anchor="middle" font-size="11" fill="#71717a">dated fossils</text>
<line x1="225" x2="225" y1="90" y2="213" stroke="#a1a1aa" stroke-width="1"/>
<circle cx="225" cy="90" r="8" fill="#7c3aed"/>
<text x="225" y="237" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">100,000 BCE</text>
<text x="225" y="257" text-anchor="middle" font-size="12" fill="#374151">Pleistocene proxy</text>
<text x="225" y="275" text-anchor="middle" font-size="11" fill="#71717a">population genetics</text>
<line x1="360" x2="360" y1="90" y2="108" stroke="#a1a1aa" stroke-width="1"/>
<circle cx="360" cy="90" r="8" fill="#2563eb"/>
<text x="360" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">10,000 BCE</text>
<text x="360" y="152" text-anchor="middle" font-size="12" fill="#374151">HYDE begins</text>
<text x="360" y="170" text-anchor="middle" font-size="11" fill="#71717a">global reconstruction</text>
<line x1="495" x2="495" y1="90" y2="213" stroke="#a1a1aa" stroke-width="1"/>
<circle cx="495" cy="90" r="8" fill="#0891b2"/>
<text x="495" y="237" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">0 CE</text>
<text x="495" y="257" text-anchor="middle" font-size="12" fill="#374151">Start of CE</text>
<text x="495" y="275" text-anchor="middle" font-size="11" fill="#71717a">historical reconstruction</text>
<line x1="630" x2="630" y1="90" y2="108" stroke="#a1a1aa" stroke-width="1"/>
<circle cx="630" cy="90" r="8" fill="#16a34a"/>
<text x="630" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">1800 CE</text>
<text x="630" y="152" text-anchor="middle" font-size="12" fill="#374151">Historical era</text>
<text x="630" y="170" text-anchor="middle" font-size="11" fill="#71717a">censuses and reconstructions</text>
<line x1="765" x2="765" y1="90" y2="213" stroke="#a1a1aa" stroke-width="1"/>
<circle cx="765" cy="90" r="8" fill="#ca8a04"/>
<text x="765" y="237" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">1950 CE</text>
<text x="765" y="257" text-anchor="middle" font-size="12" fill="#374151">UN WPP series</text>
<text x="765" y="275" text-anchor="middle" font-size="11" fill="#71717a">annual demographic model</text>
<line x1="900" x2="900" y1="90" y2="108" stroke="#a1a1aa" stroke-width="1"/>
<circle cx="900" cy="90" r="8" fill="#dc2626"/>
<text x="900" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">2023 CE</text>
<text x="900" y="152" text-anchor="middle" font-size="12" fill="#374151">Current endpoint</text>
<text x="900" y="170" text-anchor="middle" font-size="11" fill="#71717a">UN WPP 2024</text>
<text x="90" y="466" font-size="12" fill="#52525b">Fossils date human origins; genetics estimates breeding-history proxies; HYDE reconstructs population; UN WPP models annual demographic flows.</text>
<text x="90" y="486" font-size="12" fill="#71717a">No continuous global birth/death register exists for prehistory.</text>
</svg>
